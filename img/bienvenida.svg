<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración: familias llegando a la escuela infantil, que les da la bienvenida con la puerta abierta">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6EEFB"/>
      <stop offset="1" stop-color="#FFF3C4"/>
    </linearGradient>
    <g id="persona">
      <path d="M-11 -128 L11 -128 L12 -114 L56 -110 L56 -94 L13 -96 L13 -60 L42 0 L22 0 L0 -40 L-22 0 L-42 0 L-13 -60 L-13 -96 L-56 -94 L-56 -110 L-12 -114 Z"/>
      <circle cy="-150" r="24"/>
      <circle cx="-8" cy="-153" r="3" fill="#26354F"/>
      <circle cx="8" cy="-153" r="3" fill="#26354F"/>
      <path d="M-8 -142 Q0 -134 8 -142" stroke="#26354F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-15" cy="-144" r="4" fill="#FF8FB1" opacity=".7"/>
      <circle cx="15" cy="-144" r="4" fill="#FF8FB1" opacity=".7"/>
    </g>
    <g id="flor">
      <circle cx="0" cy="-9" r="7"/><circle cx="9" cy="0" r="7"/><circle cx="0" cy="9" r="7"/><circle cx="-9" cy="0" r="7"/>
      <circle r="5" fill="#FFC93C"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#cielo)"/>

  <!-- Nubes -->
  <g fill="#fff">
    <g transform="translate(110 250)"><ellipse cx="0" cy="10" rx="52" ry="20"/><circle cx="-18" cy="0" r="22"/><circle cx="14" cy="-6" r="27"/></g>
    <g transform="translate(690 240) scale(.85)"><ellipse cx="0" cy="10" rx="52" ry="20"/><circle cx="-18" cy="0" r="22"/><circle cx="14" cy="-6" r="27"/></g>
  </g>

  <!-- Guirnalda de banderines -->
  <path d="M-10 18 Q400 110 810 18" stroke="#26354F" stroke-width="3" fill="none"/>
  <g>
    <path d="M30 26 L66 34 L44 70 Z" fill="#E63E6D"/>
    <path d="M95 41 L132 47 L109 82 Z" fill="#FF8A3D"/>
    <path d="M163 52 L200 56 L178 92 Z" fill="#FFC93C"/>
    <path d="M232 58 L270 60 L249 97 Z" fill="#22A886"/>
    <path d="M302 62 L340 63 L320 100 Z" fill="#2BA8E0"/>
    <path d="M381 64 L419 64 L400 101 Z" fill="#8E5CF7"/>
    <path d="M460 63 L498 62 L480 100 Z" fill="#E63E6D"/>
    <path d="M530 60 L568 58 L551 97 Z" fill="#FF8A3D"/>
    <path d="M600 56 L637 52 L622 92 Z" fill="#FFC93C"/>
    <path d="M668 47 L705 41 L691 82 Z" fill="#22A886"/>
    <path d="M734 34 L770 26 L756 70 Z" fill="#2BA8E0"/>
  </g>

  <!-- Título -->
  <text x="400" y="170" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="74" stroke="#fff" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
    <tspan fill="#E63E6D">¡B</tspan><tspan fill="#2BA8E0">i</tspan><tspan fill="#F2A900">e</tspan><tspan fill="#22A886">n</tspan><tspan fill="#FF8A3D">v</tspan><tspan fill="#8E5CF7">e</tspan><tspan fill="#E63E6D">n</tspan><tspan fill="#2BA8E0">i</tspan><tspan fill="#F2A900">d</tspan><tspan fill="#22A886">@</tspan><tspan fill="#FF8A3D">s</tspan><tspan fill="#8E5CF7">!</tspan>
  </text>
  <text x="400" y="208" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Segoe UI', sans-serif" font-weight="700" font-size="26" fill="#26354F">a nuestra gran familia</text>

  <!-- Colinas -->
  <path d="M0 470 Q200 425 400 460 T800 450 V600 H0 Z" fill="#8FDB6A"/>
  <path d="M0 520 Q220 485 420 515 T800 505 V600 H0 Z" fill="#5CC46B"/>

  <!-- Camino a la puerta -->
  <path d="M368 500 L432 500 L480 600 L320 600 Z" fill="#F5D9A8"/>

  <!-- Escuela -->
  <g>
    <rect x="290" y="300" width="220" height="200" rx="10" fill="#fff"/>
    <path d="M268 308 L400 222 L532 308 Z" fill="#E63E6D" stroke="#E63E6D" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="400" cy="275" r="20" fill="#fff"/>
    <path d="M400 268 c-5 -8 -16 -3 -11 5 l11 10 l11 -10 c5 -8 -6 -13 -11 -5z" fill="#E63E6D"/>
    <!-- ventanas -->
    <rect x="308" y="322" width="44" height="40" rx="6" fill="#2BA8E0"/>
    <rect x="448" y="322" width="44" height="40" rx="6" fill="#2BA8E0"/>
    <path d="M330 322 V362 M308 342 H352 M470 322 V362 M448 342 H492" stroke="#fff" stroke-width="3"/>
    <!-- cartel -->
    <rect x="345" y="318" width="110" height="32" rx="16" fill="#FFC93C"/>
    <text x="400" y="341" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#26354F">¡Hola!</text>
    <!-- puerta abierta -->
    <path d="M365 500 V405 A35 35 0 0 1 435 405 V500 Z" fill="#FFE9A8"/>
    <path d="M365 500 V405 A35 35 0 0 1 435 405 V500 Z" fill="none" stroke="#FF8A3D" stroke-width="6"/>
    <path d="M435 410 L462 398 L462 506 L435 500 Z" fill="#FF8A3D"/>
    <circle cx="455" cy="455" r="3" fill="#fff"/>
    <ellipse cx="400" cy="440" rx="22" ry="10" fill="#FFC93C" opacity=".6"/>
    <rect x="372" y="494" width="56" height="10" rx="5" fill="#8E5CF7"/>
  </g>

  <!-- Familia que llega (izquierda) -->
  <line x1="181" y1="368" x2="176" y2="404" stroke="#2BA8E0" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(110 505) scale(1.3)" fill="#2BA8E0"><use href="#persona"/></g>
  <g transform="translate(228 505) scale(.9)" fill="#22A886"><use href="#persona"/></g>

  <!-- Educadora y peque (derecha) -->
  <line x1="619" y1="368" x2="624" y2="404" stroke="#8E5CF7" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(690 505) scale(1.3)" fill="#8E5CF7"><use href="#persona"/></g>
  <g transform="translate(572 505) scale(.9)" fill="#FFB300"><use href="#persona"/></g>
  <!-- molinillo del peque -->
  <g transform="translate(528 330)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#26354F" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 L0 -28 L20 -20 Z" fill="#E63E6D"/>
    <path d="M0 0 L28 0 L20 20 Z" fill="#2BA8E0"/>
    <path d="M0 0 L0 28 L-20 20 Z" fill="#22A886"/>
    <path d="M0 0 L-28 0 L-20 -20 Z" fill="#FF8A3D"/>
    <circle r="4" fill="#fff"/>
  </g>

  <!-- Globos -->
  <g>
    <path d="M760 400 Q752 340 762 300" stroke="#26354F" stroke-width="2" fill="none"/>
    <ellipse cx="762" cy="280" rx="20" ry="25" fill="#E63E6D"/>
    <path d="M740 400 Q735 360 730 330" stroke="#26354F" stroke-width="2" fill="none"/>
    <ellipse cx="730" cy="310" rx="18" ry="23" fill="#FFC93C"/>
  </g>

  <!-- Flores -->
  <use href="#flor" x="60" y="560" fill="#E63E6D"/>
  <use href="#flor" x="130" y="580" fill="#8E5CF7"/>
  <use href="#flor" x="250" y="565" fill="#2BA8E0"/>
  <use href="#flor" x="560" y="570" fill="#FF8A3D"/>
  <use href="#flor" x="660" y="580" fill="#E63E6D"/>
  <use href="#flor" x="740" y="560" fill="#FFFFFF"/>
</svg>
